# GH actions.

name: Adreno MLC Rebase Staging Release

on:
  workflow_dispatch:

concurrency:
  group: CI-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  MLC-Build-Linux:
    if: ${{ github.repository == 'gpgpu/mlc-llm' }}
    runs-on: mlc-linux-ci
    steps:
      - uses: actions/checkout@v3
        with:
          # submodules: 'recursive'
          ref: 'rebase_staging'
          fetch-depth: 0
      - name: Sync Sub modules
        shell: bash -l {0}
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --force --depth=0 --recursive          
      - name: Compile MLC
        shell: bash -l {0}
        run: |
           mkdir -p build && cd build
           echo set\(TVM_HOME 3rdparty/tvm\) >> config.cmake
           echo set\(CMAKE_BUILD_TYPE RelWithDebInfo\) >> config.cmake
           echo set\(USE_CUDA ON\) >> config.cmake
           echo set\(USE_CUTLASS OFF\) >> config.cmake
           echo set\(USE_CUBLAS OFF\) >> config.cmake
           echo set\(USE_ROCM OFF\) >> config.cmake
           echo set\(USE_VULKAN OFF\) >> config.cmake
           echo set\(USE_METAL OFF\) >> config.cmake
           echo set\(USE_OPENCL ON\) >> config.cmake
           echo set\(USE_OPENCL_ENABLE_HOST_PTR ON\) >> config.cmake
           echo set\(USE_FLASHINFER OFF\) >> config.cmake
           echo set\(USE_ADRENO_ACCL "${ADRENOACCL_SDK}"\) >> config.cmake
           cmake .. && cmake --build . --parallel $(nproc) && cd ..
      - name: Compile TVM
        shell: bash -l {0}
        run: |
           mkdir -p 3rdparty/tvm/build/;cd 3rdparty/tvm/build/;
           cp ../cmake/config.cmake . -f;
           echo set\(USE_OPENCL ON\) >> config.cmake;
           echo set\(USE_LLVM ON\) >> config.cmake;
           echo set\(USE_CUDA ON\) >> config.cmake;
           echo set\(USE_ADRENO_ACCL "${ADRENOACCL_SDK}"\) >> config.cmake
           cmake .. && cmake --build . --parallel $(nproc); cd -
      - name: Check Build Status
        shell: bash -l {0}
        run: |
           export PYTHONPATH=./python:$PYTHONPATH
           export PYTHONPATH=$PWD/3rdparty/tvm/python:$PYTHONPATH
           export PATH=$CUDA_PATH/bin:$PATH
           python -c "import mlc_llm; print(mlc_llm.__path__)"
      - name: Build LLM Models
        shell: bash -l {0}
        run: |
           export PYTHONPATH=./python:$PYTHONPATH
           export PYTHONPATH=$PWD/3rdparty/tvm/python:$PYTHONPATH
           export PATH=$CUDA_PATH/bin:$PATH
           python -c "import mlc_llm; print(mlc_llm.__path__)"
           sh ci/task/build_adreno_models.sh $CI_LLM_INVENTORY
      - name: Build CLI and Test on Target
        shell: bash -l {0}
        run: |
           set -e
           mkdir -p build-arm64 && cd build-arm64
           echo set\(TVM_HOME 3rdparty/tvm\) >> config.cmake
           echo set\(CMAKE_BUILD_TYPE RelWithDebInfo\) >> config.cmake
           echo set\(USE_CUDA OFF\) >> config.cmake
           echo set\(USE_CUTLASS OFF\) >> config.cmake
           echo set\(USE_CUBLAS OFF\) >> config.cmake
           echo set\(USE_ROCM OFF\) >> config.cmake
           echo set\(USE_VULKAN OFF\) >> config.cmake
           echo set\(USE_METAL OFF\) >> config.cmake
           echo set\(USE_OPENCL ON\) >> config.cmake
           echo set\(USE_OPENCL_ENABLE_HOST_PTR ON\) >> config.cmake
           echo set\(USE_FLASHINFER OFF\) >> config.cmake
           echo set\(USE_ADRENO_ACCL "${ADRENOACCL_SDK}"\) >> config.cmake
           echo set\(USE_ADRENO_ACCL_GRAPH_EXECUTOR "${ADRENOACCL_SDK}"\) >> config.cmake
           cmake -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK}/build/cmake/android.toolchain.cmake \
                 -DANDROID_ABI=arm64-v8a \
                 -DANDROID_PLATFORM=android-28 \
                 -DCMAKE_SYSTEM_VERSION=1 \
                 -DCMAKE_FIND_ROOT_PATH="${ADRENO_OPENCL}:${ADRENOACCL_SDK}" \
                 -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
                 -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
                 -DCMAKE_CXX_COMPILER=${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++ \
                 -DCMAKE_C_COMPILER=${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang \
                 -DMACHINE_NAME="aarch64-linux-gnu" \
                 -DCMAKE_INSTALL_PREFIX=./mlc_llm-utils-linux-arm64 ..
           cmake --build . --parallel $(nproc) --target install
           rm -rf `find mlc_llm-utils-linux-arm64 -name "*.a"`
           cp ${ADRENOACCL_SDK}/lib/* mlc_llm-utils-linux-arm64/lib/ -rfa
           cd ..
           #sh ci/task/test_adreno_models.sh `cat /etc/mlc-device`
  MLC-Build-Windows:
    needs: [MLC-Build-Linux]
    if: ${{ github.repository == 'gpgpu/mlc-llm' }}
    runs-on: mlc-windows
    steps:
      - uses: actions/checkout@v3
        with:
          #submodules: 'recursive'
          ref: 'rebase_staging'
      - name: Sync Sub modules
        shell: powershell
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --force --depth=0 --recursive          
      - name: Compile MLC
        shell: powershell
        run: |
           Push-Location
           New-Item -ItemType Directory -Force -Path "./build"
           cd build
           echo $Env:PATH
           Add-Content config.cmake "set(TVM_HOME 3rdparty/tvm)"
           Add-Content config.cmake "set(CMAKE_BUILD_TYPE RelWithDebInfo)"
           Add-Content config.cmake "set(USE_CUDA OFF)"
           Add-Content config.cmake "set(USE_CUTLASS OFF)"
           Add-Content config.cmake "set(USE_CUBLAS OFF)"
           Add-Content config.cmake "set(USE_ROCM OFF)"
           Add-Content config.cmake "set(USE_VULKAN OFF)"
           Add-Content config.cmake "set(USE_METAL OFF)"
           Add-Content config.cmake "set(USE_OPENCL ON)"
           Add-Content config.cmake "set(USE_OPENCL_ENABLE_HOST_PTR ON)"
           Add-Content config.cmake "set(USE_FLASHINFER OFF)"
           Add-Content config.cmake "set(USE_ADRENO_ACCL $ENV:ADRENOACCL_SDK_X86)"
           Add-Content config.cmake "set(USE_ADRENO_ACCL_GRAPH_EXECUTOR $ENV:ADRENOACCL_SDK_X86)"
           cmake .. -G "Visual Studio 17 2022" -A x64
           cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
           Pop-Location
      - name: Compile TVM
        shell: powershell
        run: |
           Push-Location
           New-Item -ItemType Directory -Force -Path "./3rdparty/tvm/build"
           cd 3rdparty/tvm/build/;
           cp ../cmake/config.cmake .
           Add-Content config.cmake "set(USE_OPENCL $ENV:OPENCL_SDK_ADRENO_X86)"
           Add-Content config.cmake "set(USE_LLVM $ENV:LLVM_CONFIG)"
           Add-Content config.cmake "set(USE_ADRENO_ACCL $ENV:ADRENOACCL_SDK_X86)"
           Add-Content config.cmake "set(USE_ADRENO_ACCL_GRAPH_EXECUTOR $ENV:ADRENOACCL_SDK_X86)"
           cmake .. -G "Visual Studio 17 2022" -A x64
           cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
           Pop-Location
      - name: Check Build Status
        shell: powershell
        run: |
           $env:PYTHONPATH = "$pwd\3rdparty\tvm\python;python"
           python -c "import mlc_llm; print(mlc_llm.__path__)"
      - name: Build LLM Models
        shell: powershell
        run: |
           $env:PYTHONPATH = "$pwd\3rdparty\tvm\python;python"
           python -c "import mlc_llm; print(mlc_llm.__path__)"
           ci/task/build_adreno_models_win.ps1 $Env:CI_LLM_INVENTORY
  BuildPackageLinux:
    needs: [MLC-Build-Windows]
    if: github.repository == 'gpgpu/mlc-llm'
    runs-on: mlc-linux-ci
    steps:
      - uses: actions/checkout@v3
        with:
          # submodules: 'recursive'
          ref: 'rebase_staging'
          fetch-depth: 0
      - name: Sync Sub modules
        shell: bash -l {0}
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --force --depth=0 --recursive          
      - name: Build MLC CPU Host Wheel
        shell: bash -l {0}
        run: |
           set -e
           gh release delete staging --cleanup-tag --yes --repo git@github.qualcomm.com:gpgpu/mlc-llm.git || true
           bash ci/bash.sh mlcaidev/package-cu121 \
               -e GPU cpu \
               -e MLC_CI_SETUP_DEPS 1 -j `nproc` \
               -v ${ADRENOACCL_SDK} /adrenoaccl_sdk \
               -e ADRENOACCL_SDK /adrenoaccl_sdk \
               conda run -n py312 ./ci/task/build_adreno_lib.sh
           bash ci/bash.sh mlcaidev/package-cu121 \
               -e GPU cpu \
               -e MLC_CI_SETUP_DEPS 1 -j `nproc` \
               -v ${ADRENOACCL_SDK} /adrenoaccl_sdk \
               -e ADRENOACCL_SDK /adrenoaccl_sdk \
               -e WHEEL_EXT_NAME "_adreno_cpu" \
               conda run -n py312 ./ci/task/build_wheel.sh
           mkdir -p staging
           cp wheels/*.whl staging/
           bash ci/bash.sh mlcaidev/package-cu121 \
               -e GPU cpu \
               -e MLC_CI_SETUP_DEPS 1 -j `nproc` \
               -v ${ADRENOACCL_SDK} /adrenoaccl_sdk \
               -e ADRENOACCL_SDK /adrenoaccl_sdk \
               conda run -n py312 ./ci/task/build_clean.sh
      - name: Build MLC CUDA Host Wheel
        shell: bash -l {0}
        run: |
           set -e
           bash ci/bash.sh mlcaidev/package-cu121 \
               -e GPU cuda-12.1 \
               -e MLC_CI_SETUP_DEPS 1 -j `nproc` \
               -v ${ADRENOACCL_SDK} /adrenoaccl_sdk \
               -e ADRENOACCL_SDK /adrenoaccl_sdk \
               conda run -n py312 ./ci/task/build_adreno_lib.sh
           bash ci/bash.sh mlcaidev/package-cu121 \
               -e GPU cuda-12.1 \
               -e MLC_CI_SETUP_DEPS 1 -j `nproc` \
               -v ${ADRENOACCL_SDK} /adrenoaccl_sdk \
               -e ADRENOACCL_SDK /adrenoaccl_sdk \
               -e WHEEL_EXT_NAME "_adreno_cuda" \
               conda run -n py312 ./ci/task/build_wheel.sh
           mkdir -p staging
           cp wheels/*.whl staging/
           bash ci/bash.sh mlcaidev/package-cu121 \
               -e GPU cuda-12.1 \
               -e MLC_CI_SETUP_DEPS 1 -j `nproc` \
               -v ${ADRENOACCL_SDK} /adrenoaccl_sdk \
               -e ADRENOACCL_SDK /adrenoaccl_sdk \
               conda run -n py312 ./ci/task/build_clean.sh
      - name: Build TVM CPU Host Wheel
        shell: bash -l {0}
        run: |
           set -e
           cd 3rdparty/tvm
           bash ../../ci/bash.sh mlcaidev/package-cu121 \
               -e GPU cpu \
               -e MLC_CI_SETUP_DEPS 1 -j `nproc` \
               -v ${ADRENOACCL_SDK} /adrenoaccl_sdk \
               -e ADRENOACCL_SDK /adrenoaccl_sdk \
               conda run -n py312 ./ci/adreno/build_lib.sh
           bash ../../ci/bash.sh mlcaidev/package-cu121 \
               -e GPU cpu \
               -e MLC_CI_SETUP_DEPS 1 -j `nproc` \
               -v ${ADRENOACCL_SDK} /adrenoaccl_sdk \
               -e ADRENOACCL_SDK /adrenoaccl_sdk \
               -e WHEEL_EXT_NAME "_adreno_mlc_cpu" \
               conda run -n py312 ./ci/adreno/build_wheel.sh
           mkdir -p ../../staging
           cp wheels/*.whl ../../staging/
           bash ../../ci/bash.sh mlcaidev/package-cu121 \
               -e GPU cpu \
               -e MLC_CI_SETUP_DEPS 1 -j `nproc` \
               -v ${ADRENOACCL_SDK} /adrenoaccl_sdk \
               -e ADRENOACCL_SDK /adrenoaccl_sdk \
               conda run -n py312 ./ci/adreno/build_clean.sh
           cd -
      - name: Build TVM CUDA Host Wheel
        shell: bash -l {0}
        run: |
           set -e
           cd 3rdparty/tvm
           bash ../../ci/bash.sh mlcaidev/package-cu121 \
               -e GPU cuda-12.1 \
               -e MLC_CI_SETUP_DEPS 1 -j `nproc` \
               -v ${ADRENOACCL_SDK} /adrenoaccl_sdk \
               -e ADRENOACCL_SDK /adrenoaccl_sdk \
               conda run -n py312 ./ci/adreno/build_lib.sh
           bash ../../ci/bash.sh mlcaidev/package-cu121 \
               -e GPU cuda-12.1 \
               -e MLC_CI_SETUP_DEPS 1 -j `nproc` \
               -v ${ADRENOACCL_SDK} /adrenoaccl_sdk \
               -e ADRENOACCL_SDK /adrenoaccl_sdk \
               -e WHEEL_EXT_NAME "_adreno_mlc_cuda" \
               conda run -n py312 ./ci/adreno/build_wheel.sh
           mkdir -p ../../staging
           cp wheels/*.whl ../../staging/
           bash ../../ci/bash.sh mlcaidev/package-cu121 \
               -e GPU cuda-12.1 \
               -e MLC_CI_SETUP_DEPS 1 -j `nproc` \
               -v ${ADRENOACCL_SDK} /adrenoaccl_sdk \
               -e ADRENOACCL_SDK /adrenoaccl_sdk \
               conda run -n py312 ./ci/adreno/build_clean.sh
           cd -
      - name: Build MLC Cli for Arm64
        shell: bash -l {0}
        run: |
           set -e
           mkdir -p build-arm64 && cd build-arm64
           echo set\(TVM_HOME 3rdparty/tvm\) >> config.cmake
           echo set\(CMAKE_BUILD_TYPE RelWithDebInfo\) >> config.cmake
           echo set\(USE_CUDA OFF\) >> config.cmake
           echo set\(USE_CUTLASS OFF\) >> config.cmake
           echo set\(USE_CUBLAS OFF\) >> config.cmake
           echo set\(USE_ROCM OFF\) >> config.cmake
           echo set\(USE_VULKAN OFF\) >> config.cmake
           echo set\(USE_METAL OFF\) >> config.cmake
           echo set\(USE_OPENCL ON\) >> config.cmake
           echo set\(USE_OPENCL_ENABLE_HOST_PTR ON\) >> config.cmake
           echo set\(USE_FLASHINFER OFF\) >> config.cmake
           echo set\(USE_ADRENO_ACCL "${ADRENOACCL_SDK}"\) >> config.cmake
           echo set\(USE_ADRENO_ACCL_GRAPH_EXECUTOR "${ADRENOACCL_SDK}"\) >> config.cmake
           cmake -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK}/build/cmake/android.toolchain.cmake \
                 -DANDROID_ABI=arm64-v8a \
                 -DANDROID_PLATFORM=android-28 \
                 -DCMAKE_SYSTEM_VERSION=1 \
                 -DCMAKE_FIND_ROOT_PATH="${ADRENO_OPENCL}:${ADRENOACCL_SDK}" \
                 -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
                 -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
                 -DCMAKE_CXX_COMPILER=${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++ \
                 -DCMAKE_C_COMPILER=${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang \
                 -DMACHINE_NAME="aarch64-linux-gnu" \
                 -DCMAKE_INSTALL_PREFIX=./mlc_llm-utils-linux-arm64 ..
           cmake --build . --parallel $(nproc) --target install
           rm -rf `find mlc_llm-utils-linux-arm64 -name "*.a"`
           cp ${ADRENOACCL_SDK}/lib/* mlc_llm-utils-linux-arm64/lib/ -rfa
           tar jcvfp mlc_llm-utils-linux-arm64.tar.bz2 mlc_llm-utils-linux-arm64
           mv mlc_llm-utils-linux-arm64.tar.bz2 ../staging
           cd ..
      - name: Build LLM Models
        shell: bash -l {0}
        run: |
           conda remove -y --name mlc-ci --all
           conda create -y -n mlc-ci -c conda-forge \
               llvmdev=15 cmake>=3.24 git rust numpy \
               decorator psutil typing_extensions scipy \
               attrs git-lfs gcc=10.4 gxx=10.4 python=3.12
           conda activate mlc-ci
           conda env list
           pip install staging/mlc_llm_adreno_cuda*.whl
           pip install staging/tvm_adreno_mlc_cuda*.whl
           export LD_LIBRARY_PATH=$CUDA_PATH/lib64/
           export PATH=$CUDA_PATH/bin:$PATH
           python -c "import mlc_llm; print(mlc_llm.__path__)"
           python -c "import tvm; print(tvm.__path__)"
           sh ci/task/build_adreno_models.sh $CI_LLM_INVENTORY $CI_LLM_STAGING_ARTIFACTS
      - name: Publish Artifacts
        shell: bash -l {0}
        run: |
           gh release delete mlc-staging --cleanup-tag --yes --repo "$STAGING_RELEASE_REPO_MLC" || true
           gh release create mlc-staging --latest --title mlc-staging --repo "$STAGING_RELEASE_REPO_MLC" --notes "MLC Nightly builds"
           gh release upload mlc-staging staging/*.whl --clobber --repo "$STAGING_RELEASE_REPO_MLC"
           gh release upload mlc-staging staging/*.tar.bz2 --clobber --repo "$STAGING_RELEASE_REPO_MLC"
           cp staging/* ${CI_PACKAGE_REPO_STAGING}/ -rfa
           rm -rf staging
           gh release delete llm-staging-artifacts --cleanup-tag --yes --repo "$STAGING_RELEASE_REPO_MLC" || true
           gh release create llm-staging-artifacts --latest --title llm-staging-artifacts --repo "$STAGING_RELEASE_REPO_MLC" --notes "Android (Adreno) LLM Nightly artifacts"
           gh release upload llm-staging-artifacts $CI_LLM_STAGING_ARTIFACTS/dist/libs/*.so --clobber --repo "$STAGING_RELEASE_REPO_MLC"
  BuildPackageWindows:
    needs: [BuildPackageLinux]
    if: ${{ github.repository == 'gpgpu/mlc-llm' }}
    runs-on: mlc-windows
    steps:
      - uses: actions/checkout@v3
        with:
          # submodules: 'recursive'
          ref: 'rebase_staging'
      - name: Sync Sub modules
        shell: powershell
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --force --depth=0 --recursive          
      - name: Compile MLC
        shell: powershell
        run: |
           Push-Location
           New-Item -ItemType Directory -Force -Path "./build"
           cd build
           echo $Env:PATH
           Add-Content config.cmake "set(TVM_HOME 3rdparty/tvm)"
           Add-Content config.cmake "set(CMAKE_BUILD_TYPE RelWithDebInfo)"
           Add-Content config.cmake "set(USE_CUDA OFF)"
           Add-Content config.cmake "set(USE_CUTLASS OFF)"
           Add-Content config.cmake "set(USE_CUBLAS OFF)"
           Add-Content config.cmake "set(USE_ROCM OFF)"
           Add-Content config.cmake "set(USE_VULKAN OFF)"
           Add-Content config.cmake "set(USE_METAL OFF)"
           Add-Content config.cmake "set(USE_OPENCL $ENV:OPENCL_SDK_ADRENO_X86)"
           Add-Content config.cmake "set(USE_OPENCL_ENABLE_HOST_PTR ON)"
           Add-Content config.cmake "set(USE_FLASHINFER OFF)"
           Add-Content config.cmake "set(USE_ADRENO_ACCL $ENV:ADRENOACCL_SDK_X86)"
           Add-Content config.cmake "set(USE_ADRENO_ACCL_GRAPH_EXECUTOR $ENV:ADRENOACCL_SDK_X86)"
           cmake .. -G "Visual Studio 17 2022" -A x64
           cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
           cmake --install . --prefix ".\mlc_llm-utils-win-x86" --config Release
           Copy-Item -Path $Env:ADRENOACCL_SDK_X86\bin\* -Destination "./mlc_llm-utils-win-x86/bin/"
           Compress-Archive -Path mlc_llm-utils-win-x86/* -CompressionLevel Optimal -DestinationPath mlc_llm-utils-win-x86.zip -Force
           Pop-Location
      - name: Compile TVM
        shell: powershell
        run: |
           Push-Location
           New-Item -ItemType Directory -Force -Path "./3rdparty/tvm/build"
           cd 3rdparty/tvm/build/;
           cp ../cmake/config.cmake .
           Add-Content config.cmake "set(USE_OPENCL $ENV:OPENCL_SDK_ADRENO_X86)"
           Add-Content config.cmake "set(USE_LLVM $ENV:LLVM_CONFIG)"
           Add-Content config.cmake "set(USE_ADRENO_ACCL $ENV:ADRENOACCL_SDK_X86)"
           Add-Content config.cmake "set(USE_ADRENO_ACCL_GRAPH_EXECUTOR $ENV:ADRENOACCL_SDK_X86)"
           cmake .. -G "Visual Studio 17 2022" -A x64
           cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
           Pop-Location
      - name: Check Build Status and Build Models
        shell: powershell
        run: |
           $env:PYTHONPATH = "$pwd\3rdparty\tvm\python;python"
           python -c "import mlc_llm; print(mlc_llm.__path__)"
           ci/task/build_adreno_models_win_nightly.ps1 $Env:CI_LLM_STAGING_ARTIFACTS
      - name: Build Package and Publish
        shell: powershell
        run: |
           Push-Location
           $Env:WHEEL_EXT_NAME="_adreno_cpu"
           cd python
           python.exe .\setup.py bdist_wheel --plat-name win_amd64
           Pop-Location
           Push-Location
           cd 3rdparty/tvm/python
           python.exe .\setup.py bdist_wheel --plat-name win_amd64
           Pop-Location
           #try { gh release delete mlc-staging --cleanup-tag --yes --repo $Env:STAGING_RELEASE_REPO_MLC } catch { }
           #gh release create mlc-staging --latest --title mlc-staging --repo $Env:STAGING_RELEASE_REPO_MLC --notes "Windows MLC staging builds"
           gh release upload mlc-staging .\build\mlc_llm-utils-win-x86.zip --clobber --repo $Env:STAGING_RELEASE_REPO_MLC
           foreach ($i in Get-ChildItem -Path python/dist) {gh release upload mlc-staging .\python\dist\$i --clobber --repo $Env:STAGING_RELEASE_REPO_MLC}
           foreach ($i in Get-ChildItem -Path 3rdparty/tvm/python/dist) {gh release upload mlc-staging .\3rdparty\tvm\python\dist\$i --clobber --repo $Env:STAGING_RELEASE_REPO_MLC}
           foreach ($i in Get-ChildItem -Path dist/libs/*.dll) {gh release upload llm-staging-artifacts $i --clobber --repo $Env:STAGING_RELEASE_REPO_MLC}
           # Copy to common Linux CI
           Copy-Item -Path .\build\mlc_llm-utils-win-x86.zip -Destination "$Env:CI_PACKAGE_REPO_STAGING/"
           foreach ($i in Get-ChildItem -Path python/dist) {Copy-Item -Path .\python\dist\$i -Destination "$Env:CI_PACKAGE_REPO_STAGING/"}
           foreach ($i in Get-ChildItem -Path 3rdparty/tvm/python/dist) {Copy-Item -Path .\3rdparty\tvm\python\dist\$i -Destination "$Env:CI_PACKAGE_REPO_STAGING/"}
           rm .\python\build -r -Force -ErrorAction Ignore
           rm .\python\dist -r -Force -ErrorAction Ignore
           rm .\python\*.egg-info -r -Force -ErrorAction Ignore
           rm .\3rdparty\tvm\python\build -r -Force -ErrorAction Ignore
           rm .\3rdparty\tvm\python\dist -r -Force -ErrorAction Ignore
           rm .\3rdparty\tvm\python\*.egg-info -r -Force -ErrorAction Ignore
        env:
           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
