# Checkout mainline commit on local repo and run tests.
name: Adreno Package Generation

on:
  schedule:
    # 2:30 AM IST
    - cron: "1 20 * * *"
  workflow_dispatch:

concurrency:
  group: mlcpkg
  cancel-in-progress: true

jobs:
  BuildPackageLinux:
    if: github.repository == 'gpgpu/mlc-llm'
    runs-on: mlc-linux-ci
    steps:
      - uses: actions/checkout@v3
        with:
          # submodules: 'recursive'
          fetch-depth: 0
      - name: Sync Sub modules
        shell: bash -l {0}
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --force --depth=0 --recursive
      - name: Build MLC CUDA Host Wheel
        shell: bash -l {0}
        run: |
           set -e
           source $VULKAN_SDK_PATH/setup-env.sh
           rm -rf build
           mkdir -p build && cd build
           echo set\(TVM_HOME 3rdparty/tvm\) >> config.cmake
           echo set\(CMAKE_BUILD_TYPE RelWithDebInfo\) >> config.cmake
           echo set\(USE_CUDA ON\) >> config.cmake
           echo set\(USE_CUTLASS OFF\) >> config.cmake
           echo set\(USE_CUBLAS OFF\) >> config.cmake
           echo set\(USE_ROCM OFF\) >> config.cmake
           echo set\(USE_VULKAN ON\) >> config.cmake
           echo set\(USE_METAL OFF\) >> config.cmake
           echo set\(USE_OPENCL ON\) >> config.cmake
           echo set\(USE_OPENCL_ENABLE_HOST_PTR ON\) >> config.cmake
           echo set\(USE_FLASHINFER OFF\) >> config.cmake
           echo set\(USE_ADRENO_ACCL "${ADRENOACCL_SDK}"\) >> config.cmake
           cmake .. -G Ninja && cmake --build . --parallel $(nproc) && cd ..
           mkdir -p nightly
           CMAKE_GENERATOR=Ninja python3 -m build --wheel --outdir ./nightly
      - name: Build TVM CUDA Host Wheel
        shell: bash -l {0}
        run: |
           set -e
           source $VULKAN_SDK_PATH/setup-env.sh
           rm -rf 3rdparty/tvm/build
           mkdir -p 3rdparty/tvm/build/;cd 3rdparty/tvm/build/;
           cp ../cmake/config.cmake . -f;
           echo set\(USE_VULKAN ON\) >> config.cmake
           echo set\(USE_OPENCL ON\) >> config.cmake;
           echo set\(USE_LLVM $LLVM_CONFIG\) >> config.cmake;
           echo set\(USE_CUDA ON\) >> config.cmake;
           echo set\(USE_ADRENO_ACCL "${ADRENOACCL_SDK}"\) >> config.cmake
           cmake .. -G Ninja && cmake --build . --parallel $(nproc);
           cd ..
           mkdir -p wheels
           CMAKE_GENERATOR=Ninja python3 -m build --wheel --outdir ./wheels
           cp wheels/*.whl ../../nightly/
           cd -
      - name: Build MLC Cli for Arm64
        shell: bash -l {0}
        run: |
           set -e
           source $VULKAN_SDK_PATH/setup-env.sh
           rm -rf build-arm64
           mkdir -p build-arm64 && cd build-arm64
           echo set\(TVM_HOME 3rdparty/tvm\) >> config.cmake
           echo set\(CMAKE_BUILD_TYPE RelWithDebInfo\) >> config.cmake
           echo set\(USE_CUDA OFF\) >> config.cmake
           echo set\(USE_CUTLASS OFF\) >> config.cmake
           echo set\(USE_CUBLAS OFF\) >> config.cmake
           echo set\(USE_ROCM OFF\) >> config.cmake
           echo set\(USE_VULKAN ON\) >> config.cmake
           echo set\(USE_METAL OFF\) >> config.cmake
           echo set\(USE_OPENCL ON\) >> config.cmake
           echo set\(USE_OPENCL_ENABLE_HOST_PTR ON\) >> config.cmake
           echo set\(USE_FLASHINFER OFF\) >> config.cmake
           echo set\(USE_ADRENO_ACCL "${ADRENOACCL_SDK}"\) >> config.cmake
           echo set\(USE_ADRENO_ACCL_GRAPH_EXECUTOR "${ADRENOACCL_SDK}"\) >> config.cmake
           cmake -DANDROID_TOOLCHAIN_ROOT=${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64 \
                 -DANDROID_NATIVE_API_LEVEL=28 \
                 -DANDROID_ABI=arm64-v8a \
                 -DCMAKE_SYSTEM_NAME=Android \
                 -DCMAKE_ANDROID_ARCH_ABI="arm64-v8a" \
                 -DCMAKE_SYSROOT="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/" \
                 -DANDROID_PLATFORM=android-28 \
                 -DCMAKE_SYSTEM_VERSION=1 \
                 -DCMAKE_FIND_ROOT_PATH="${ADRENO_OPENCL}:${ADRENOACCL_SDK}" \
                 -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
                 -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
                 -DCMAKE_CXX_COMPILER="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++" \
                 -DCMAKE_C_COMPILER="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" \
                 -DMACHINE_NAME="aarch64-linux-gnu" \
                 -DCMAKE_INSTALL_PREFIX=./mlc_llm-utils-linux-arm64 .. -G Ninja
           cmake --build . --parallel $(nproc) --target install
           cp lib/* mlc_llm-utils-linux-arm64/lib/.
           rm -rf `find mlc_llm-utils-linux-arm64/lib/ -name "*.a"`
           cp ${ADRENOACCL_SDK}/lib/* mlc_llm-utils-linux-arm64/lib/ -rfa
           cp ${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so mlc_llm-utils-linux-arm64/lib/.
           tar jcvfp mlc_llm-utils-linux-arm64.tar.bz2 mlc_llm-utils-linux-arm64
           mv mlc_llm-utils-linux-arm64.tar.bz2 ../nightly
           cd ..
      - name: Build LLM Models
        shell: bash -l {0}
        run: |
           set -e
           pip uninstall mlc_llm tvm apache-tvm-ffi -y
           pip install nightly/mlc_llm-*.whl
           pip install nightly/tvm-*.whl
           export LD_LIBRARY_PATH=$CUDA_PATH/lib64/
           export PATH=$CUDA_PATH/bin:$PATH
           python -c "import mlc_llm; print(mlc_llm.__path__)"
           python -c "import tvm; print(tvm.__path__)"
           mkdir -p $CI_LLM_NIGHTLY_ARTIFACTS
           sh ci/task/build_adreno_models.sh $CI_LLM_INVENTORY $CI_LLM_NIGHTLY_ARTIFACTS "ACCL"
      - name: Publish Artifacts
        shell: bash -l {0}
        run: |
           gh release delete mlc-nightly --cleanup-tag --yes --repo "$RELEASE_REPO" || true
           gh release create mlc-nightly --latest --title mlc-nightly --repo "$RELEASE_REPO" --notes "MLC Nightly builds"
           gh release upload mlc-nightly nightly/*.whl --clobber --repo "$RELEASE_REPO"
           gh release upload mlc-nightly nightly/*.tar.bz2 --clobber --repo "$RELEASE_REPO"
           cp nightly/* ${CI_PACKAGE_REPO_NIGHTLY}/
           rm -rf nightly
           gh release delete llm-nightly-artifacts --cleanup-tag --yes --repo "$RELEASE_REPO" || true
           gh release create llm-nightly-artifacts --latest --title llm-nightly-artifacts --repo "$RELEASE_REPO" --notes "Android (Adreno) LLM Nightly artifacts"
           gh release upload llm-nightly-artifacts $CI_LLM_NIGHTLY_ARTIFACTS/dist/libs/*.so --clobber --repo "$RELEASE_REPO"

  BuildPackageWindows:
    needs: [BuildPackageLinux]
    if: ${{ github.repository == 'gpgpu/mlc-llm' }}
    runs-on: mlc-windows
    steps:
      - uses: actions/checkout@v3
        with:
          # submodules: 'recursive'
          ref: ''
      - name: Sync Sub modules
        shell: powershell
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --force --depth=0 --recursive
      - name: Compile MLC
        shell: powershell
        run: |
           Push-Location
           New-Item -ItemType Directory -Force -Path "./build"
           cd build
           echo $Env:PATH
           Add-Content config.cmake "set(TVM_HOME 3rdparty/tvm)"
           Add-Content config.cmake "set(CMAKE_BUILD_TYPE RelWithDebInfo)"
           Add-Content config.cmake "set(USE_CUDA OFF)"
           Add-Content config.cmake "set(USE_CUTLASS OFF)"
           Add-Content config.cmake "set(USE_CUBLAS OFF)"
           Add-Content config.cmake "set(USE_ROCM OFF)"
           Add-Content config.cmake "set(USE_VULKAN ON)"
           Add-Content config.cmake "set(USE_METAL OFF)"
           Add-Content config.cmake "set(USE_OPENCL ON)"
           Add-Content config.cmake "set(USE_OPENCL_ENABLE_HOST_PTR ON)"
           Add-Content config.cmake "set(USE_FLASHINFER OFF)"
           Add-Content config.cmake "set(USE_ADRENO_ACCL $ENV:ADRENOACCL_SDK_X86)"
           Add-Content config.cmake "set(USE_ADRENO_ACCL_GRAPH_EXECUTOR $ENV:ADRENOACCL_SDK_X86)"
           Add-Content config.cmake "set(USE_CLML $ENV:OPENCL_SDK_ADRENO_X86)"
           Add-Content config.cmake "set(USE_CLML_GRAPH_EXECUTOR $ENV:OPENCL_SDK_ADRENO_X86)"
           cmake .. -G "Visual Studio 17 2022" -A x64
           cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
           cmake --install . --prefix ".\mlc_llm-utils-win-x86" --config Release
           Copy-Item -Path ./lib/* -Destination "./mlc_llm-utils-win-x86/bin/"
           Copy-Item -Path $Env:ADRENOACCL_SDK_X86\bin\* -Destination "./mlc_llm-utils-win-x86/bin/"
           Compress-Archive -Path mlc_llm-utils-win-x86/* -CompressionLevel Optimal -DestinationPath mlc_llm-utils-win-x86.zip -Force
           Pop-Location
      - name: Compile TVM
        shell: powershell
        run: |
           Push-Location
           New-Item -ItemType Directory -Force -Path "./3rdparty/tvm/build"
           cd 3rdparty/tvm/build/;
           cp ../cmake/config.cmake .
           Add-Content config.cmake "set(USE_VULKAN ON)"
           Add-Content config.cmake "set(USE_OPENCL $ENV:OPENCL_SDK_ADRENO_X86)"
           Add-Content config.cmake "set(USE_LLVM $ENV:LLVM_CONFIG)"
           Add-Content config.cmake "set(USE_ADRENO_ACCL $ENV:ADRENOACCL_SDK_X86)"
           Add-Content config.cmake "set(USE_ADRENO_ACCL_GRAPH_EXECUTOR $ENV:ADRENOACCL_SDK_X86)"
           Add-Content config.cmake "set(USE_CLML $ENV:OPENCL_SDK_ADRENO_X86)"
           Add-Content config.cmake "set(USE_CLML_GRAPH_EXECUTOR $ENV:OPENCL_SDK_ADRENO_X86)"
           cmake .. -G "Visual Studio 17 2022" -A x64
           cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
           Pop-Location
      - name: Compile MLC for Arm64
        shell: powershell
        run: |
           Push-Location
           New-Item -ItemType Directory -Force -Path "./build-arm64"
           cd build-arm64
           echo $Env:PATH
           Add-Content config.cmake "set(TVM_HOME 3rdparty/tvm)"
           Add-Content config.cmake "set(CMAKE_BUILD_TYPE RelWithDebInfo)"
           Add-Content config.cmake "set(USE_CUDA OFF)"
           Add-Content config.cmake "set(USE_CUTLASS OFF)"
           Add-Content config.cmake "set(USE_CUBLAS OFF)"
           Add-Content config.cmake "set(USE_ROCM OFF)"
           Add-Content config.cmake "set(USE_VULKAN $ENV:VULKAN_SDK_ARM64)"
           Add-Content config.cmake "set(USE_METAL OFF)"
           Add-Content config.cmake "set(USE_OPENCL ON)"
           Add-Content config.cmake "set(USE_OPENCL_ENABLE_HOST_PTR ON)"
           Add-Content config.cmake "set(USE_FLASHINFER OFF)"
           Add-Content config.cmake "set(USE_ADRENO_ACCL $ENV:ADRENOACCL_SDK_ARM64)"
           Add-Content config.cmake "set(USE_ADRENO_ACCL_GRAPH_EXECUTOR $ENV:ADRENOACCL_SDK_ARM64)"
           Add-Content config.cmake "set(USE_CLML $ENV:OPENCL_SDK_ADRENO_ARM64)"
           Add-Content config.cmake "set(USE_CLML_GRAPH_EXECUTOR $ENV:OPENCL_SDK_ADRENO_ARM64)"
           Add-Content config.cmake "set(CMAKE_SYSTEM_PROCESSOR ARM64)"
           cmake .. -G "Visual Studio 17 2022" -A ARM64
           cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
           cmake --install . --prefix ".\mlc_llm-utils-win-arm64" --config Release
           Copy-Item -Path ./lib/* -Destination "./mlc_llm-utils-win-arm64/bin/"
           Copy-Item -Path $Env:ADRENOACCL_SDK_ARM64\bin\* -Destination "./mlc_llm-utils-win-arm64/bin/"
           Compress-Archive -Path mlc_llm-utils-win-arm64/* -CompressionLevel Optimal -DestinationPath mlc_llm-utils-win-arm64.zip -Force
           Pop-Location
      - name: Check Build Status and Build Models
        shell: powershell
        run: |
           $env:PYTHONPATH = "$pwd\3rdparty\tvm\python;python"
           python -m pip uninstall apache-tvm-ffi -y
           python3 -m pip install  -v --target=python ./3rdparty/tvm/3rdparty/tvm-ffi/
           python -c "import mlc_llm; print(mlc_llm.__path__)"
           ci/task/build_adreno_models_win.ps1 $Env:CI_LLM_INVENTORY "ACCL" "CLML"
      - name: Build Package and Publish
        shell: powershell
        run: |
           Push-Location
           New-Item -ItemType Directory -Force -Path "./nightly"
           python3 -m build --wheel --outdir ./nightly
           cd 3rdparty/tvm
           New-Item -ItemType Directory -Force -Path "./wheels"
           python3 -m build --wheel --outdir ./wheels
           Pop-Location
           Copy-Item -Path .\3rdparty\tvm\wheels\* .\nightly\.
           gh release upload mlc-nightly .\build\mlc_llm-utils-win-x86.zip --clobber --repo $Env:RELEASE_REPO
           foreach ($i in Get-ChildItem -Path ./nightly) {gh release upload mlc-nightly .\nightly\$i --clobber --repo $Env:RELEASE_REPO}
           foreach ($i in Get-ChildItem -Path dist/libs/*.dll) {gh release upload llm-nightly-artifacts $i --clobber --repo $Env:RELEASE_REPO}
           # Copy to common Linux CI
           foreach ($i in Get-ChildItem -Path ./dist/libs) {Copy-Item -Path .\dist\libs\$i -Destination $Env:CI_LLM_NIGHTLY_ARTIFACTS/dist/libs"}
           Copy-Item -Path .\build\mlc_llm-utils-win-x86.zip -Destination "$Env:CI_PACKAGE_REPO_NIGHTLY/"
           foreach ($i in Get-ChildItem -Path ./nightly) {Copy-Item -Path .\nightly\$i -Destination "$Env:CI_PACKAGE_REPO_NIGHTLY/"}
        env:
           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
