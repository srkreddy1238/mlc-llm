# Checkout mainline commit on local repo and run tests.
name: Adreno Release Generation

on:
  workflow_dispatch:

concurrency:
  group: mlcrelease
  cancel-in-progress: true

jobs:
  BuildPackageLinuxACCL:
    if: github.repository == 'gpgpu/mlc-llm'    
    runs-on: mlc-linux-ci    
    steps:
      - name: Authenticate
        if: github.actor != 'kvegiraj'
        shell: bash -l {0}
        run: |
          echo "Not authorized to run this workflow - contact <kvegiraj@qti.qualcomm.com>"
          exit 1
      - uses: actions/checkout@v3
        with:
          # submodules: 'recursive'
          fetch-depth: 0
      - name: Sync Sub modules
        shell: bash -l {0}
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --force --depth=0 --recursive
      - name: Build MLC CUDA Host Wheel
        shell: bash -l {0}
        run: |
           set -e
           RELEASE_TAG=`cat adreno_version`
           MLC_WHEEL_NAME="mlc_llm_adreno_accl_${RELEASE_TAG}"
           source $VULKAN_SDK_PATH/setup-env.sh
           rm -rf build
           mkdir -p build && cd build
           echo set\(TVM_HOME 3rdparty/tvm\) >> config.cmake
           echo set\(CMAKE_BUILD_TYPE RelWithDebInfo\) >> config.cmake
           echo set\(USE_CUDA ON\) >> config.cmake
           echo set\(USE_CUTLASS OFF\) >> config.cmake
           echo set\(USE_CUBLAS OFF\) >> config.cmake
           echo set\(USE_ROCM OFF\) >> config.cmake
           echo set\(USE_VULKAN ON\) >> config.cmake
           echo set\(USE_METAL OFF\) >> config.cmake
           echo set\(USE_OPENCL ON\) >> config.cmake
           echo set\(USE_OPENCL_ENABLE_HOST_PTR ON\) >> config.cmake
           echo set\(USE_FLASHINFER OFF\) >> config.cmake
           echo set\(USE_CLML "${ADRENO_OPENCL}"\) >> config.cmake
           echo set\(USE_ADRENO_ACCL "${ADRENOACCL_SDK}"\) >> config.cmake
           cmake .. -G Ninja && cmake --build . --parallel $(nproc) && cd ..
           mkdir -p release
           sed -i.bak "s/^[[:space:]]*name[[:space:]]*=.*/name = \"${MLC_WHEEL_NAME}\"/" pyproject.toml
           CMAKE_GENERATOR=Ninja python3 -m build --wheel --outdir ./release
      - name: Build TVM CUDA Host Wheel
        shell: bash -l {0}
        run: |
           set -e
           RELEASE_TAG=`cat adreno_version`
           TVM_WHEEL_NAME="tvm_adreno_accl_${RELEASE_TAG}"
           source $VULKAN_SDK_PATH/setup-env.sh
           rm -rf 3rdparty/tvm/build
           mkdir -p 3rdparty/tvm/build/;cd 3rdparty/tvm/build/;
           cp ../cmake/config.cmake . -f;
           echo set\(USE_VULKAN ON\) >> config.cmake
           echo set\(USE_OPENCL ON\) >> config.cmake;
           echo set\(USE_LLVM $LLVM_CONFIG\) >> config.cmake;
           echo set\(USE_CUDA ON\) >> config.cmake;
           echo set\(USE_CLML "${ADRENO_OPENCL}"\) >> config.cmake
           echo set\(USE_ADRENO_ACCL "${ADRENOACCL_SDK}"\) >> config.cmake
           cmake .. -G Ninja && cmake --build . --parallel $(nproc);
           cd ..
           mkdir -p wheels
           sed -i.bak "s/^[[:space:]]*name[[:space:]]*=.*/name = \"${TVM_WHEEL_NAME}\"/" pyproject.toml
           CMAKE_GENERATOR=Ninja python3 -m build --wheel --outdir ./wheels
           cp wheels/*.whl ../../release/
           cd -
      - name: Build MLC Cli for Arm64
        shell: bash -l {0}
        run: |
           set -e
           RELEASE_TAG=`cat adreno_version`
           source $VULKAN_SDK_PATH/setup-env.sh
           rm -rf build-arm64
           mkdir -p build-arm64 && cd build-arm64
           echo set\(TVM_HOME 3rdparty/tvm\) >> config.cmake
           echo set\(CMAKE_BUILD_TYPE RelWithDebInfo\) >> config.cmake
           echo set\(USE_CUDA OFF\) >> config.cmake
           echo set\(USE_CUTLASS OFF\) >> config.cmake
           echo set\(USE_CUBLAS OFF\) >> config.cmake
           echo set\(USE_ROCM OFF\) >> config.cmake
           echo set\(USE_VULKAN ON\) >> config.cmake
           echo set\(USE_METAL OFF\) >> config.cmake
           echo set\(USE_OPENCL ON\) >> config.cmake
           echo set\(USE_OPENCL_ENABLE_HOST_PTR ON\) >> config.cmake
           echo set\(USE_FLASHINFER OFF\) >> config.cmake
           echo set\(USE_CLML "${ADRENO_OPENCL}"\) >> config.cmake
           echo set\(USE_CLML_GRAPH_EXECUTOR "${ADRENO_OPENCL}"\) >> config.cmake
           echo set\(USE_ADRENO_ACCL "${ADRENOACCL_SDK}"\) >> config.cmake
           echo set\(USE_ADRENO_ACCL_GRAPH_EXECUTOR "${ADRENOACCL_SDK}"\) >> config.cmake
           cmake -DANDROID_TOOLCHAIN_ROOT=${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64 \
                 -DANDROID_NATIVE_API_LEVEL=28 \
                 -DANDROID_ABI=arm64-v8a \
                 -DCMAKE_SYSTEM_NAME=Android \
                 -DCMAKE_ANDROID_ARCH_ABI="arm64-v8a" \
                 -DCMAKE_SYSROOT="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/" \
                 -DANDROID_PLATFORM=android-28 \
                 -DCMAKE_SYSTEM_VERSION=1 \
                 -DCMAKE_FIND_ROOT_PATH="${ADRENO_OPENCL}:${ADRENOACCL_SDK}" \
                 -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
                 -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
                 -DCMAKE_CXX_COMPILER="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++" \
                 -DCMAKE_C_COMPILER="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" \
                 -DMACHINE_NAME="aarch64-linux-gnu" \
                 -DCMAKE_INSTALL_PREFIX=./mlc_llm-utils-linux-arm64-accl-${RELEASE_TAG} .. -G Ninja
           cmake --build . --parallel $(nproc) --target install
           cp lib/* mlc_llm-utils-linux-arm64-accl-${RELEASE_TAG}/lib/.
           rm -rf `find mlc_llm-utils-linux-arm64-accl-${RELEASE_TAG}/lib/ -name "*.a"`
           cp ${ADRENOACCL_SDK}/lib/* mlc_llm-utils-linux-arm64-accl-${RELEASE_TAG}/lib/ -rfa
           cp ${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so mlc_llm-utils-linux-arm64-accl-${RELEASE_TAG}/lib/.
           tar jcvfp mlc_llm-utils-linux-arm64-accl-${RELEASE_TAG}.tar.bz2 mlc_llm-utils-linux-arm64-accl-${RELEASE_TAG}
           mv mlc_llm-utils-linux-arm64-accl-${RELEASE_TAG}.tar.bz2 ../release
           cd ..
      - name: Build LLM Models and Benchmark
        shell: bash -l {0}
        run: |
           set -e
           RELEASE_TAG=`cat adreno_version`
           python3 -m pip uninstall -y $(python3 -m pip list | grep 'mlc_llm' | awk '{print $1}')
           python3 -m pip uninstall -y $(python3 -m pip list | grep 'tvm' | awk '{print $1}')
           pip install release/mlc_llm*.whl
           pip install release/tvm*.whl
           export LD_LIBRARY_PATH=$CUDA_PATH/lib64/
           export PATH=$CUDA_PATH/bin:$PATH
           python -c "import mlc_llm; print(mlc_llm.__path__)"
           python -c "import tvm; print(tvm.__path__)"
           mkdir -p $CI_LLM_RELEASE_ARTIFACTS/${RELEASE_TAG}
           sh ci/task/build_adreno_models.sh $CI_LLM_INVENTORY $CI_LLM_RELEASE_ARTIFACTS/${RELEASE_TAG} "ACCL"
      - name: Publish Artifacts
        shell: bash -l {0}
        run: |
           set -e
           RELEASE_TAG=`cat adreno_version`
           gh release delete mlc-release-${RELEASE_TAG} --cleanup-tag --yes --repo "$RELEASE_REPO" || true
           gh release create mlc-release-${RELEASE_TAG} --latest --title mlc-release-${RELEASE_TAG} --repo "$RELEASE_REPO" --notes "MLC Release builds"
           gh release upload mlc-release-${RELEASE_TAG} release/*.whl --clobber --repo "$RELEASE_REPO"
           gh release upload mlc-release-${RELEASE_TAG} release/*.tar.bz2 --clobber --repo "$RELEASE_REPO"
           mkdir -p ${CI_PACKAGE_REPO_RELEASE}/${RELEASE_TAG}
           cp release/* ${CI_PACKAGE_REPO_RELEASE}/${RELEASE_TAG}/
           rm -rf release
           gh release delete llm-release-artifacts-${RELEASE_TAG} --cleanup-tag --yes --repo "$RELEASE_REPO" || true
           gh release create llm-release-artifacts-${RELEASE_TAG} --latest --title llm-release-artifacts-${RELEASE_TAG} --repo "$RELEASE_REPO" --notes "Android (Adreno) LLM Release artifacts"
           gh release upload llm-release-artifacts-${RELEASE_TAG} $CI_LLM_RELEASE_ARTIFACTS/${RELEASE_TAG}/dist/libs/*.so --clobber --repo "$RELEASE_REPO"

  BuildPackageWindows:
    needs: [BuildPackageWindowsACCL]
    if: ${{ github.repository == 'gpgpu/mlc-llm' }}
    runs-on: mlc-windows
    steps:
      - uses: actions/checkout@v3
        with:
          # submodules: 'recursive'
          ref: ''
      - name: Sync Sub modules
        shell: powershell
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --force --depth=0 --recursive
      - name: Compile MLC
        shell: powershell
        run: |
           $RELEASE_TAG = Get-Content -path adreno_version
           Get-ChildItem Env:
           Push-Location
           New-Item -ItemType Directory -Force -Path "./build"
           cd build
           echo $Env:PATH
           Add-Content config.cmake "set(TVM_HOME 3rdparty/tvm)"
           Add-Content config.cmake "set(CMAKE_BUILD_TYPE RelWithDebInfo)"
           Add-Content config.cmake "set(USE_CUDA OFF)"
           Add-Content config.cmake "set(USE_CUTLASS OFF)"
           Add-Content config.cmake "set(USE_CUBLAS OFF)"
           Add-Content config.cmake "set(USE_ROCM OFF)"
           Add-Content config.cmake "set(USE_VULKAN ON)"
           Add-Content config.cmake "set(USE_METAL OFF)"
           Add-Content config.cmake "set(USE_OPENCL ON)"
           Add-Content config.cmake "set(USE_OPENCL_ENABLE_HOST_PTR ON)"
           Add-Content config.cmake "set(USE_FLASHINFER OFF)"
           Add-Content config.cmake "set(USE_CLML $ENV:OPENCL_SDK_ADRENO_X86)"
           Add-Content config.cmake "set(USE_CLML_GRAPH_EXECUTOR $ENV:OPENCL_SDK_ADRENO_X86)"
           cmake .. -G "Visual Studio 17 2022" -A x64
           cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
           cmake --install . --prefix ".\mlc_llm-utils-win-x86-${RELEASE_TAG}" --config Release
           Copy-Item -Path ./lib/* -Destination "./mlc_llm-utils-win-x86-${RELEASE_TAG}/bin/"
           Compress-Archive -Path mlc_llm-utils-win-x86-${RELEASE_TAG}/* -CompressionLevel Optimal -DestinationPath mlc_llm-utils-win-x86-${RELEASE_TAG}.zip -Force
           Pop-Location
      - name: Compile TVM
        shell: powershell
        run: |
           Push-Location
           New-Item -ItemType Directory -Force -Path "./3rdparty/tvm/build"
           cd 3rdparty/tvm/build/;
           cp ../cmake/config.cmake .
           Add-Content config.cmake "set(USE_VULKAN ON)"
           Add-Content config.cmake "set(USE_OPENCL $ENV:OPENCL_SDK_ADRENO_X86)"
           Add-Content config.cmake "set(USE_LLVM $ENV:LLVM_CONFIG)"
           Add-Content config.cmake "set(USE_CLML $ENV:OPENCL_SDK_ADRENO_X86)"
           Add-Content config.cmake "set(USE_CLML_GRAPH_EXECUTOR $ENV:OPENCL_SDK_ADRENO_X86)"
           cmake .. -G "Visual Studio 17 2022" -A x64
           cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
           Pop-Location
      - name: Compile MLC for Arm64
        shell: powershell
        run: |
           $RELEASE_TAG=Get-Content -path adreno_version
           Push-Location
           New-Item -ItemType Directory -Force -Path "./build-arm64"
           cd build-arm64
           echo $Env:PATH
           Add-Content config.cmake "set(TVM_HOME 3rdparty/tvm)"
           Add-Content config.cmake "set(CMAKE_BUILD_TYPE RelWithDebInfo)"
           Add-Content config.cmake "set(USE_CUDA OFF)"
           Add-Content config.cmake "set(USE_CUTLASS OFF)"
           Add-Content config.cmake "set(USE_CUBLAS OFF)"
           Add-Content config.cmake "set(USE_ROCM OFF)"
           Add-Content config.cmake "set(USE_VULKAN $ENV:VULKAN_SDK_ARM64)"
           Add-Content config.cmake "set(USE_METAL OFF)"
           Add-Content config.cmake "set(USE_OPENCL ON)"
           Add-Content config.cmake "set(USE_OPENCL_ENABLE_HOST_PTR ON)"
           Add-Content config.cmake "set(USE_FLASHINFER OFF)"
           Add-Content config.cmake "set(USE_CLML $ENV:OPENCL_SDK_ADRENO_ARM64)"
           Add-Content config.cmake "set(USE_CLML_GRAPH_EXECUTOR $ENV:OPENCL_SDK_ADRENO_ARM64)"
           Add-Content config.cmake "set(CMAKE_SYSTEM_PROCESSOR ARM64)"
           cmake .. -G "Visual Studio 17 2022" -A ARM64
           cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS
           cmake --install . --prefix ".\mlc_llm-utils-win-arm64-${RELEASE_TAG}" --config Release
           Copy-Item -Path ./lib/* -Destination "./mlc_llm-utils-win-arm64-${RELEASE_TAG}/bin/"
           Compress-Archive -Path mlc_llm-utils-win-arm64-${RELEASE_TAG}/* -CompressionLevel Optimal -DestinationPath mlc_llm-utils-win-arm64-${RELEASE_TAG}.zip -Force
           Pop-Location
      - name: Build Package and Build Models
        shell: powershell
        run: |
           $RELEASE_TAG=Get-Content -path adreno_version
           $MLC_WHEEL_NAME="mlc_llm_adreno_$RELEASE_TAG"
           $TVM_WHEEL_NAME="tvm_adreno_$RELEASE_TAG"
           Push-Location
           (Get-Content pyproject.toml) -replace '^\s*name\s*=\s*"mlc_llm"', "name = `"$MLC_WHEEL_NAME`"" | Set-Content pyproject.toml
           New-Item -ItemType Directory -Force -Path "./release"
           python3 -m build --wheel --outdir ./release
           cd 3rdparty/tvm
           (Get-Content pyproject.toml) -replace '^\s*name\s*=\s*"tvm"', "name = `"$TVM_WHEEL_NAME`"" | Set-Content pyproject.toml
           New-Item -ItemType Directory -Force -Path "./wheels"
           python3 -m build --wheel --outdir ./wheels
           Pop-Location
           Copy-Item -Path .\3rdparty\tvm\wheels\* .\release\.
           C:\ProgramData\anaconda3\shell\condabin\conda-hook.ps1
           conda activate mlc-ci-build
           pip list
           pip list | Select-String "mlc_llm" | ForEach-Object { pip uninstall -y ($_.ToString().Split(' ')[0]) }
           pip list | Select-String "tvm" | ForEach-Object { pip uninstall -y ($_.ToString().Split(' ')[0]) }
           pip list
           foreach ($i in Get-ChildItem -Path ".\release\*.whl" ) {pip install $i}
           pip list
           python -c "import mlc_llm; print(mlc_llm.__path__)"
           ci/task/build_adreno_models_win.ps1 $Env:CI_LLM_INVENTORY "CLML"
      - name: Publish Artifacts
        shell: powershell
        run: |
           $Env:RELEASE_TAG=Get-Content -path adreno_version
           gh release upload mlc-release-$Env:RELEASE_TAG .\build\mlc_llm-utils-win-x86-$Env:RELEASE_TAG.zip --clobber --repo $Env:RELEASE_REPO
           gh release upload mlc-release-$Env:RELEASE_TAG .\build-arm64\mlc_llm-utils-win-arm64-$Env:RELEASE_TAG.zip --clobber --repo $Env:RELEASE_REPO
           foreach ($i in Get-ChildItem -Path ./release) {gh release upload mlc-release-$Env:RELEASE_TAG .\release\$i --clobber --repo $Env:RELEASE_REPO}
           foreach ($i in Get-ChildItem -Path dist/libs/*.dll) {gh release upload llm-release-artifacts-$Env:RELEASE_TAG $i --clobber --repo $Env:RELEASE_REPO}
           # Copy to common Linux CI
           foreach ($i in Get-ChildItem -Path ./dist/libs) {Copy-Item -Path .\dist\libs\$i -Destination "$Env:CI_LLM_RELEASE_ARTIFACTS/$Env:RELEASE_TAG/dist/libs"}
           Copy-Item -Path .\build\mlc_llm-utils-win-x86-$Env:RELEASE_TAG.zip -Destination "$Env:CI_PACKAGE_REPO_RELEASE/$Env:RELEASE_TAG"
           Copy-Item -Path .\build-arm64\mlc_llm-utils-win-arm64-$Env:RELEASE_TAG.zip -Destination "$Env:CI_PACKAGE_REPO_RELEASE/$Env:RELEASE_TAG"
           foreach ($i in Get-ChildItem -Path ./release) {Copy-Item -Path .\release\$i -Destination "$Env:CI_PACKAGE_REPO_RELEASE/$Env:RELEASE_TAG"}
        env:
           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
