           RELEASE_TAG=`cat adreno_version`
           gh release delete mlc-release-${RELEASE_TAG} --cleanup-tag --yes --repo "$RELEASE_REPO" || true
           gh release create mlc-release-${RELEASE_TAG} --latest --title mlc-release-${RELEASE_TAG} --repo "$RELEASE_REPO" --notes "MLC Release builds"
           gh release upload mlc-release-${RELEASE_TAG} release/*.whl --clobber --repo "$RELEASE_REPO"
           gh release upload mlc-release-${RELEASE_TAG} release/*.tar.bz2 --clobber --repo "$RELEASE_REPO"
           mkdir -p ${CI_PACKAGE_REPO_RELEASE}/${RELEASE_TAG}
           cp release/* ${CI_PACKAGE_REPO_RELEASE}/${RELEASE_TAG}/
           rm -rf release
           gh release delete llm-release-artifacts-${RELEASE_TAG} --cleanup-tag --yes --repo "$RELEASE_REPO" || true
           gh release create llm-release-artifacts-${RELEASE_TAG} --latest --title llm-release-artifacts-${RELEASE_TAG} --repo "$RELEASE_REPO" --notes "Android (Adreno) LLM Release artifacts"
           gh release upload llm-release-artifacts-${RELEASE_TAG} $CI_LLM_RELEASE_ARTIFACTS/${RELEASE_TAG}/dist/libs/*.so --clobber --repo "$RELEASE_REPO"
